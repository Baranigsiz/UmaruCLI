<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - Go + HTMX</title>
  
  <!-- HTMX 2.0 -->
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Subtle HTMX indicator transition */
    .htmx-indicator {
      opacity: 0;
      transition: opacity 200ms ease-in-out;
    }
    .htmx-request .htmx-indicator {
      opacity: 1;
    }
    .htmx-request.htmx-indicator {
      opacity: 1;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Navigation -->
  <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center font-black text-slate-950 shadow-lg shadow-emerald-500/20">
          ⚡
        </div>
        <div>
          <span class="font-bold text-slate-100 tracking-tight">{{.Title}}</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 font-medium ml-2 border border-emerald-500/20">Go + HTMX</span>
        </div>
      </div>

      <nav class="flex items-center gap-4 text-sm font-medium">
        <a href="/api/health" target="_blank" class="text-slate-400 hover:text-slate-200 transition-colors">Health API</a>
        <a href="https://htmx.org/docs" target="_blank" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all text-xs font-semibold">
          HTMX Docs ↗
        </a>
      </nav>
    </div>
  </header>

  <!-- Page Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-10">
    {{embed}}
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 bg-slate-900/30 py-6 text-center text-xs text-slate-500">
    <div class="max-w-6xl mx-auto px-4">
      Built with ⚡ <span class="text-slate-300 font-semibold">Go Fiber</span> &amp; <span class="text-emerald-400 font-semibold">HTMX 2.0</span> • Scaffolding generated by <span class="text-slate-300">Umaru CLI</span>
    </div>
  </footer>

</body>
</html>
