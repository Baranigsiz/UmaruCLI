name: Release

on:
  push:
    # Trigger the workflow only when pushing tags starting with 'v' (e.g., v1.0.0)
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by GoReleaser to generate changelogs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Use the latest stable Go version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
