name: Release

on:
  push:
    # Trigger the workflow only when pushing tags starting with 'v' (e.g., v1.0.0)
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by GoReleaser to generate changelogs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Manifests and Docs with Release Checksums
        run: |
          python3 .github/scripts/update-manifests.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/umaru.json Formula/umaru.rb install.sh install.ps1 README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): auto-update manifests and docs for ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:main
          else
            echo "No manifest or docs changes to commit."
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
