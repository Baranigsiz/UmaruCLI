name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['stable', '1.24.x']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Run Unit Tests with Coverage (Linux only)
        if: runner.os == 'Linux'
        run: go test -v -coverprofile=coverage.out ./...

      - name: Run Race Detector (Linux only)
        if: runner.os == 'Linux'
        run: go test -v -race ./...

      - name: Build Binary Test
        run: go build -v -o umaru-bin main.go

  cross-build:
    name: Cross-Build (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Verify Cross-Compilation
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: |
          OUTPUT_NAME="umaru-${{ matrix.target.goos }}-${{ matrix.target.goarch }}"
          if [ "${{ matrix.target.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          go build -v -o "${OUTPUT_NAME}" main.go
          ls -lh "${OUTPUT_NAME}"
